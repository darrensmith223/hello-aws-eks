# statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ldap
  namespace: ldap
spec:
  serviceName: ldap
  replicas: 1
  selector:
    matchLabels:
      app: ldap
  template:
    metadata:
      labels:
        app: ldap
    spec:
      containers:
        - name: ldap
          image: quay.io/389ds/dirsrv:latest
          ports:
            - containerPort: 3389
          envFrom:
            - secretRef:
                name: ldap-admin
          volumeMounts:
            - name: ldap-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: ldap-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi