# external-secret.yaml
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ldap-admin
  namespace: ldap
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ldap-admin
    creationPolicy: Owner
  data:
    - secretKey: DM_PASSWORD
      remoteRef:
        key: dev/ldap/admin
        property: dm_password