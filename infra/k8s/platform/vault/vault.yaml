apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"

spec:
  project: default

  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.30.1

    helm:
      values: |
        global:
          enabled: true

        injector:
          enabled: true

        server:
          image:
            repository: hashicorp/vault
            tag: 1.19.5

          serviceAccount:
            create: false
            name: vault

          dataStorage:
            enabled: true
            storageClass: gp3
            size: 10Gi
            accessMode: ReadWriteOnce

          auditStorage:
            enabled: true
            storageClass: gp3
            size: 5Gi
            accessMode: ReadWriteOnce

          standalone:
            enabled: false

          ha:
            enabled: true
            replicas: 1

            # This dev cluster only runs one Vault replica. A disruption
            # budget with maxUnavailable=0 prevents EKS managed node
            # updates from draining the node that hosts vault-0.
            #
            # Re-enable this when Vault is deployed with multiple replicas
            # in a highly available configuration.
            disruptionBudget:
              enabled: false

            raft:
              enabled: true
              setNodeId: true

              config: |
                ui = true

                listener "tcp" {
                  tls_disable     = 1
                  address         = "[::]:8200"
                  cluster_address = "[::]:8201"
                }

                storage "raft" {
                  path = "/vault/data"
                }

                seal "awskms" {
                  region     = "us-east-1"
                  kms_key_id = "alias/practice-eks-dev-vault-unseal"
                }

                service_registration "kubernetes" {}

          # Vault can legitimately be sealed or uninitialized while its
          # process is otherwise healthy. Treat those states as HTTP 204
          # so Kubernetes does not restart Vault merely because it has not
          # yet been initialized or auto-unsealed.
          readinessProbe:
            enabled: true
            path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"

          livenessProbe:
            enabled: true
            path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
            initialDelaySeconds: 60

        ui:
          enabled: true
          serviceType: ClusterIP

  destination:
    server: https://kubernetes.default.svc
    namespace: vault

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false