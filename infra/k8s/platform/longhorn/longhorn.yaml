apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.12.0
    helm:
      values: |
        persistence:
          # Keep gp3 as the cluster's default StorageClass. Applications must
          # explicitly request storageClassName: longhorn to use Longhorn.
          defaultClass: false
          defaultClassReplicaCount: 2

        defaultSettings:
          # Longhorn's default data path (/var/lib/longhorn) is now backed
          # by a dedicated local NVMe instance-store volume rather than
          # the root disk (see eks-foundation module). 20% reserved-
          # available is Longhorn's guidance for dedicated disks; if this
          # ever reverts to sharing the root disk, bump this to the more
          # conservative 25% root-disk guidance.
          #
          # NOTE: instance store is ephemeral (wiped on stop/terminate).
          # Durability comes from Longhorn's own replication
          # (defaultReplicaCount: 2 below), not from this disk surviving
          # node loss.
          defaultReplicaCount: 2
          storageMinimalAvailablePercentage: 20
          orphanAutoDeletion: false

        longhornUI:
          replicas: 1

        # Prometheus Operator discovers Longhorn Manager metrics through this
        # ServiceMonitor. Prometheus is installed in sync wave 8, before
        # Longhorn in wave 15, so the CRD exists when this chart syncs.
        metrics:
          serviceMonitor:
            enabled: true

        ingress:
          enabled: false

        # Longhorn recommends disabling the Helm pre-upgrade hook when
        # the chart is managed by ArgoCD/GitOps. Upgrade safety is still
        # validated explicitly during planned Longhorn upgrades.
        preUpgradeChecker:
          jobEnabled: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      # The ServiceMonitor CRD is supplied by kube-prometheus-stack. This
      # avoids a first-sync dry-run race if the child Applications reconcile
      # concurrently while Prometheus CRDs are still registering.
      - SkipDryRunOnMissingResource=true
