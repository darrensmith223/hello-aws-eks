# INTENTIONALLY NOT included in kustomization.yaml.
#
# This is an internet-facing ALB pointed at the Longhorn UI, which has no
# authentication of its own in a standard Helm install. Adding this to
# kustomization.yaml as-is would expose an unauthenticated
# storage-management interface to the internet.
#
# Access the UI for now via `kubectl port-forward` or through Rancher's
# cluster explorer instead. Before wiring this back in, put it behind
# either an authenticating proxy (e.g. oauth2-proxy in front of the ALB)
# or restrict alb.ingress.kubernetes.io/scheme to internal and access it
# over the private network only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "16"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /
    external-dns.alpha.kubernetes.io/hostname: longhorn.ddsprojects.link
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - longhorn.ddsprojects.link
  rules:
    - host: longhorn.ddsprojects.link
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
